name: API Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # daily API health run, 05:00 UTC

permissions:
  contents: read

jobs:
  rest-assured:
    name: Rest Assured (Java + TestNG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: testng-report
          path: target/surefire-reports/
          retention-days: 14

  newman:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install -g newman newman-reporter-htmlextra
      - run: >
          newman run postman/restful-booker.postman_collection.json
          -e postman/restful-booker.postman_environment.json
          -r cli,htmlextra --reporter-htmlextra-export site/index.html
          --reporter-htmlextra-title "Restful Booker API Tests - ShipSure QA"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: newman-report
          path: site/index.html
          retention-days: 14
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  publish-report:
    name: Publish live test report
    needs: [rest-assured, newman]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
