name: API Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # daily API health run, 05:00 UTC

jobs:
  rest-assured:
    name: Rest Assured (Java + TestNG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: testng-report
          path: target/surefire-reports/
          retention-days: 14

  newman:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g newman newman-reporter-htmlextra
      - run: >
          newman run postman/restful-booker.postman_collection.json
          -e postman/restful-booker.postman_environment.json
          -r cli,htmlextra --reporter-htmlextra-export newman-report.html
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: newman-report
          path: newman-report.html
          retention-days: 14
